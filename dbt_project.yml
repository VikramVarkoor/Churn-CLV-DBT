name: 'churn_clv_dbt'
version: '1.0.0'
config-version: 2

profile: 'churn_clv_dbt'

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Default cutoff. Override per run with --vars '{cutoff_date: 2011-09-01}'.
  # Both cutoffs used in this project (train 2011-03-01, test 2011-09-01) are
  # fixed in docs/design.md, not chosen here.
  cutoff_date: '2011-03-01'
  label_window_days: 90
  raw_parquet_path: 'data/raw/online_retail_ii_combined.parquet'
  # Phase 3 CLV holdout window, fixed in docs/design.md's "Calibration cutoff and holdout
  # window" section: 245 days after the CLV calibration cutoff (2011-03-01), checked there
  # against the real last row with a 38-day margin.
  clv_holdout_days: 245

models:
  churn_clv_dbt:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: incremental
      +incremental_strategy: delete+insert
      +unique_key: ['customer_id', 'cutoff_date']
